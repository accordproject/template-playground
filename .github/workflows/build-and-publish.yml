name: Build and Publish

on:
  push:
    branches: 
      - main
      
permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:

  publish:
    name: Deploy playground
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: NPM Install
        if: github.ref == 'refs/heads/main'
        run: npm ci

      - name: NPM Build
        run: SERVER_ROOT=https://playground.accordproject.org NODE_OPTIONS=--max_old_space_size=8192 npm run build
        if: github.ref == 'refs/heads/main'

      - name: Set S3 
        if: github.ref == 'refs/heads/main'
        run: |
            echo "AWS_S3_BUCKET=${{secrets.AWS_S3_BUCKET}}" >> $GITHUB_ENV

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Pre-compress assets
        if: github.ref == 'refs/heads/main'
        run: |
          # The bundle visualiser report is a build artefact, not part of the site.
          rm -f dist/stats.html
          node scripts/precompress.mjs dist/assets

      - name: Deploy to S3
        run: |
          BUCKET=s3://${{ secrets.AWS_S3_BUCKET }}
          IMMUTABLE="public, max-age=31536000, immutable"

          # 1. Content-hashed assets, raw copies. Safe to cache forever.
          aws s3 sync dist/assets $BUCKET/assets \
            --acl public-read --follow-symlinks \
            --exclude "*.br" --exclude "*.gz" \
            --cache-control "$IMMUTABLE"

          # 2. Pre-compressed copies, served by deploy/cloudfront/compressed-assets.js.
          for enc in br gz; do
            [ "$enc" = br ] && encoding=br || encoding=gzip
            aws s3 cp dist/assets $BUCKET/assets --recursive \
              --acl public-read --follow-symlinks \
              --exclude "*" --include "*.js.$enc" \
              --content-encoding "$encoding" --content-type "text/javascript" \
              --cache-control "$IMMUTABLE"
            aws s3 cp dist/assets $BUCKET/assets --recursive \
              --acl public-read --follow-symlinks \
              --exclude "*" --include "*.css.$enc" \
              --content-encoding "$encoding" --content-type "text/css" \
              --cache-control "$IMMUTABLE"
          done

          # 3. index.html last, and always revalidated, so it never points at
          #    assets that have not been uploaded yet.
          aws s3 cp dist/index.html $BUCKET/index.html \
            --acl public-read --content-type "text/html" \
            --cache-control "no-cache"

          # 4. Everything else, and remove files that are no longer in the build.
          aws s3 sync dist $BUCKET \
            --acl public-read \
            --follow-symlinks \
            --delete
        env:
          AWS_REGION: 'us-east-1'

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
        env:
          AWS_REGION: 'us-east-1'
